name: Bug report
description: Report a reproducible defect in BASTION-KERN GIS.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, personal information, precise private location data, or exploitable vulnerability details. Report security issues privately using SECURITY.md."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
      placeholder: Clear, concise summary
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Web app
        - Event API
        - iOS
        - Android
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: Numbered steps; use synthetic or public coordinates only.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser/OS, Node version, app commit, and whether Mapbox credentials are configured. Never paste tokens.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety and privacy check
      options:
        - label: I removed credentials and private/personal location data from this report.
          required: true
